<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskGram — Telegram Style</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" id="profileMenuBtn" title="Switch profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div id="syncStatus" class="sync-dot" style="display:none;"></div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search lists and tasks">
      </div>
    </div>

    <!-- PROFILE SWITCHER DROPDOWN -->
    <div class="profile-backdrop" id="profileBackdrop" aria-hidden="true"></div>
    <div class="profile-menu" id="profileMenu">
      <div class="profile-menu-header">
        <div class="avatar" id="profileMenuCurrentAvatar"></div>
        <div class="profile-menu-current-info">
          <div class="profile-menu-current-name" id="profileMenuCurrentName"></div>
          <div class="profile-menu-current-sub">Current profile</div>
        </div>
      </div>
      <div class="profile-menu-list" id="profileMenuList"></div>
      <div class="profile-menu-add" id="profileMenuAddBtn">
        <div class="profile-menu-add-avatar">+</div>
        <span>Add profile</span>
      </div>
    </div>

    <div class="list-scroll" id="listScroll"></div>

    <div class="new-list-row" id="newListBtn">
      <div class="new-list-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>New list</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12l3 3 5-6"/><circle cx="12" cy="12" r="10"/></svg>
      <div>Select a list to see your tasks</div>
    </div>

    <div id="chatArea" style="display:none; flex-direction:column; flex:1; min-height:0;">
      <div class="panel-header">
        <button class="icon-btn sidebar-back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="avatar" id="headerAvatar"></div>
        <div class="panel-title">
          <div class="name" id="headerName"></div>
          <div class="status" id="headerStatus"></div>
        </div>
        <div class="panel-header-actions">
          <button class="icon-btn" id="renameListBtn" title="Rename list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          </button>
          <button class="icon-btn" id="clearDoneBtn" title="Clear completed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
          <button class="icon-btn" id="deleteListBtn" title="Delete list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <div class="pinned-bar" id="pinnedBar" style="display:none;">
        <div class="pin-stripe"></div>
        <svg class="pinned-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14l-1.4-1.4a2 2 0 0 1-.6-1.4V9a5 5 0 0 0-10 0v5.2a2 2 0 0 1-.6 1.4z"/></svg>
        <div class="pinned-bar-text">
          <div class="pinned-bar-label" id="pinnedBarLabel">Pinned task</div>
          <div class="pinned-bar-content" id="pinnedBarContent"></div>
        </div>
        <div class="pinned-bar-close" id="pinnedBarClose" title="Unpin">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>

      <div class="selection-bar" id="selectionBar" style="display:none;">
        <div class="selection-bar-left">
          <button class="icon-btn" id="selectionCancelBtn" title="Cancel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span id="selectionCount">0 selected</span>
        </div>
        <div class="selection-bar-actions">
          <button class="icon-btn" id="selectionDoneBtn" title="Mark done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="icon-btn" id="selectionDeleteBtn" title="Delete selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="composer-input-wrap">
          <textarea id="taskInput" rows="1" placeholder="Write a task"></textarea>
        </div>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- NEW LIST MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">New list</h3>
    <input id="newListName" type="text" placeholder="e.g. Groceries" maxlength="30">
    <div class="swatches" id="swatches"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="createListBtn">Create</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-backdrop" id="confirmBackdrop">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<!-- EDIT TASK DIALOG -->
<div class="modal-backdrop" id="editBackdrop">
  <div class="modal">
    <h3>Edit task</h3>
    <input id="editTaskInput" type="text" maxlength="500">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="editCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="editSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- TASK CONTEXT MENU -->
<div class="context-menu" id="contextMenu"></div>

<script src="script.js"></script>
</body>
</html>
